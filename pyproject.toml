[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "share-of-model"
version = "0.1.0"
description = "Implementação de referência do protocolo de mensuração de Share of Model (Artigo 3)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rafael Grou"}
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
som = "som.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["som*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
